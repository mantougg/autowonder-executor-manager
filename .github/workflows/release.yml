# 发布流水线（T11-F1 增强）：推送 v* tag 自动构建并发布 GitHub Release。
# 路径与本地完全一致（npm build → 质量门 → make release），避免两套逻辑。
# 质量门：go vet/test 三绿 + 前端构建 + UI 规范自检——不过不放行。
# 手动触发（workflow_dispatch）便于正式 tag 前演练产物。
name: release
# 运行标题显示版本名（而非触发提交的 message）
run-name: ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（演练用，如 v0.1.0-rc1；正式发布请打 tag）'
        required: false
        default: 'v0.0.0-dev'

permissions:
  contents: write # 创建 Release 与上传产物

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端依赖与构建（web/dist）
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: 质量门：vet + test + UI 自检
        run: |
          go vet ./...
          go test ./... -count=1
          node web/scripts/verify-ui.mjs

      - name: 确定版本号（tag 或手动输入）
        id: ver
        run: echo "version=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 五平台构建 + checksums（make release）
        run: make release VERSION=${{ steps.ver.outputs.version }}

      - name: 产物自检（checksums 全过 + 本机产物可执行）
        run: |
          cd release && sha256sum -c checksums.txt
          ./awem-linux-amd64 version | grep -F "${{ steps.ver.outputs.version }}"

      - name: 提取 tag 变更日志作为 Release 正文
        run: |
          git fetch --tags --force
          NOTES="$(git tag -l --format='%(contents:body)' "${{ steps.ver.outputs.version }}")"
          if [ -z "$NOTES" ]; then
            NOTES="演练构建（无对应 tag，变更日志缺失）。"
          fi
          printf '%s\n' "$NOTES" > release-notes.md
          echo "-- 正文预览（前 5 行）--"; head -5 release-notes.md

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          # 正文 = annotated tag 的变更日志（文字总结与列举，不用自动生成的链接式 notes）
          body_path: release-notes.md
          # workflow_dispatch 演练时（无真实 tag）只出草稿，不真正发版
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            release/awem-*
            release/checksums.txt
